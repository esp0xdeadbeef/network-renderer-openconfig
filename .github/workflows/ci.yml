name: "CI"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # tests/test-s88-ci-gate.sh reads CI history

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  flake-check:
    name: "nix flake check"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Test/nix scratch must not depend on the image's /tmp. The runner
      # exports RUNNER_TEMP for exactly this purpose; publish it to the
      # remaining steps (job-level env cannot read the runner context).
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      # Evaluate-only gate: the test suite below builds and runs the real
      # artifacts, so this job only proves the flake outputs evaluate.
      - name: "Check flake outputs"
        run: nix flake check --no-build -L --show-trace

  tests:
    name: "test suite"
    runs-on: ubuntu-latest
    env:
      # tests/test-s88-ci-gate.sh reads the last CI run; needs actions: read.
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 300
    steps:
      - name: "Use the runner temp dir for scratch"
        shell: bash
        run: |
          set -euo pipefail
          for name in TMPDIR TMP TEMP; do
            printf '%s=%s\n' "$name" "$RUNNER_TEMP" >> "$GITHUB_ENV"
          done
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      # The suites shell out to rg/sops/yq, which the runner image does not ship.
      - name: "Install test dependencies"
        shell: bash
        run: |
          set -euo pipefail
          nix profile install --accept-flake-config \
            nixpkgs#ripgrep \
            nixpkgs#jq \
            nixpkgs#sops \
            nixpkgs#yq
          printf '%s\n' "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: "Run repository test suite"
        env:
          NETWORK_REPO_DIRECT_TEST_OK: "1"
        run: bash tests/test.sh
